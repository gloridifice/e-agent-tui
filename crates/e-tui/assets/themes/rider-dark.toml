name = "rider-dark"

# The palette is intentionally open-ended. Add any named colors here and
# reference them from the fixed semantic roles below.
[colors]
night = "#262626"
ash = "#323232"
umber = "#474747"
bark = "#646464"
mist = "#bdbdbd"
sage = "#85c46c"
blush = "#c9a26d"
coral = "#6c95eb"
rose = "#ed94c0"
ember = "#ff5647"
honey = "#e8bf6a"
purple = "#c191ff"
teal = "#39cc9b"
cyan = "#66c3cc"
added_bg = "#323b2f"
removed_bg = "#492e2b"

[semantics.surface]
base = { fg = "mist", bg = "night" }
panel = { fg = "mist", bg = "ash" }
selection = { fg = "mist", bg = "umber" }
primary_text = { fg = "mist" }
muted_text = { fg = "bark" }

[semantics.markdown]
text = { fg = "mist" }
heading1 = { fg = "coral", bold = true }
heading2 = { fg = "purple", bold = true }
heading3 = { fg = "teal", bold = true }
heading4 = { fg = "cyan", italic = true }
heading5 = { fg = "purple" }
heading6 = { fg = "bark" }
emphasis = { fg = "mist", italic = true }
strong = { fg = "blush" }
strikethrough = { fg = "mist" }
inline_code = { fg = "cyan" }
link_text = { fg = "coral", bold = true }
link_url = { fg = "coral", underline = true }
image = { fg = "blush", italic = true }
quote_marker = { fg = "bark" }
rule = { fg = "bark" }
code_block_bg = { fg = "mist", bg = "night" }
table_border = { fg = "bark" }
table_header = { fg = "mist", bold = true }
list_marker = { fg = "bark" }
task_checked = { fg = "sage" }
task_unchecked = { fg = "bark" }
mermaid_border = { fg = "bark" }
mermaid_node = { fg = "mist" }
mermaid_edge = { fg = "bark" }
mermaid_edge_label = { fg = "blush" }
mermaid_title = { fg = "coral", bold = true }

[semantics.markdown_weak]
text = { fg = "bark" }
heading1 = { fg = "bark", bold = true }
heading2 = { fg = "bark", bold = true }
heading3 = { fg = "bark" }
heading4 = { fg = "bark", italic = true }
heading5 = { fg = "bark" }
heading6 = { fg = "umber" }
emphasis = { fg = "bark", italic = true }
strong = { fg = "bark", bold = true }
strikethrough = { fg = "umber" }
inline_code = { fg = "bark", bg = "night", padding = 1 }
link_text = { fg = "bark", bold = true }
link_url = { fg = "bark", underline = true }
image = { fg = "bark", italic = true }
quote_marker = { fg = "umber" }
rule = { fg = "umber" }
code_block_bg = { fg = "bark", bg = "night" }
table_border = { fg = "umber" }
table_header = { fg = "bark", bold = true }
list_marker = { fg = "umber" }
task_checked = { fg = "bark" }
task_unchecked = { fg = "umber" }
mermaid_border = { fg = "umber" }
mermaid_node = { fg = "bark" }
mermaid_edge = { fg = "umber" }
mermaid_edge_label = { fg = "bark" }
mermaid_title = { fg = "bark", bold = true }

[semantics.code]
text = { fg = "mist" }
comment = { fg = "sage" }
keyword = { fg = "coral" }
type = { fg = "purple" }
function = { fg = "teal" }
string = { fg = "blush" }
constant = { fg = "rose" }
attribute = { fg = "purple" }
escape = { fg = "rose" }
invalid = { fg = "mist" }
meta = { fg = "bark" }

[semantics.code_weak]
text = { fg = "bark" }
comment = { fg = "umber" }
keyword = { fg = "bark" }
type = { fg = "bark" }
function = { fg = "bark" }
string = { fg = "bark" }
constant = { fg = "bark" }
attribute = { fg = "bark", italic = true }
escape = { fg = "bark" }
invalid = { fg = "umber" }
meta = { fg = "umber" }

[semantics.input]
background = { fg = "mist", bg = "ash" }
text = { fg = "mist" }
prompt = { fg = "coral" }
cursor = { fg = "night", bg = "mist" }
hint = { fg = "bark" }
placeholder = { fg = "rose", bold = true }
selection = { fg = "night", bg = "mist" }
status = { fg = "mist" }
status_hint = { fg = "bark" }
status_accent = { fg = "coral" }

[semantics.working_status]
idle = { fg = "bark" }
waiting = { fg = "bark" }
running = { fg = "honey" }
success = { fg = "sage" }
failure = { fg = "ember" }
cancelled = { fg = "honey" }

[semantics.log]
info = { fg = "bark" }
warning = { fg = "honey" }
error = { fg = "ember" }

[semantics.activity]
label = { fg = "umber" }
detail = { fg = "bark" }
metadata = { fg = "bark" }

[semantics.card]
user = { fg = "mist", bg = "ash" }
context = { fg = "bark", bg = "ash" }
detail = { fg = "bark", bg = "ash" }
attachment = { fg = "bark", bg = "ash" }

[semantics.overlay]
background = { fg = "mist", bg = "ash" }
border = { fg = "coral" }
text = { fg = "mist" }
muted = { fg = "bark" }
selection = { fg = "night", bg = "mist" }
accent = { fg = "coral" }
selected_marker = { fg = "sage" }
unselected_marker = { fg = "mist" }

[semantics.diff]
text = { fg = "mist" }
added = { fg = "mist", bg = "added_bg" }
removed = { fg = "mist", bg = "removed_bg" }
added_accent = { fg = "sage" }
removed_accent = { fg = "ember" }
context_accent = { fg = "bark" }
separator = { fg = "umber" }

[semantics.separator]
bar = { fg = "bark" }
line = { fg = "umber" }
placeholder = { fg = "sage", bg = "night" }

[semantics.history]
text = { fg = "mist" }
heading = { fg = "mist" }
metadata = { fg = "bark" }
total_elapsed = { fg = "mist" }
separator = { fg = "umber" }
hint = { fg = "umber" }
progress = { fg = "blush" }
bar_text = { fg = "night" }

[semantics.history.operation]
model = { fg = "bark" }
read = { fg = "sage" }
edit = { fg = "coral" }
bash = { fg = "teal" }
search = { fg = "purple" }
other = { fg = "bark" }

[semantics.history.duration]
highest = { fg = "ember" }
second = { fg = "blush" }
top_five = { fg = "mist" }
remaining = { fg = "bark" }
unknown = { fg = "bark" }
