# Embedded defaults for dshe. User overrides are loaded from
# %APPDATA%\dshe\config.toml; omitted fields inherit these values.

# Appearance
spinner_style = "A"
spinner_frame_ms = 40
theme = "ferra"
plain_color = false
# Foreground-fade interpolation origin (does not replace theme surfaces).
background_color = "#000000"

# Behavior
language = "en"
remember_last_session = false
model_marks = []
model_default_efforts = []
default_mode = "standard"
# Kept for compatibility with older config files; Enter always sends.
enter_sends = true
paste_placeholder_chars = 64
long_content_lines = 20
copy_toast_secs = 3
history_limit = 1000

# Display
show_model_in_status = true
show_tool_duration = true
read_merge = true
# Thinking content display: compact | lines | full.
thinking_display = "compact"
# Max wrapped display rows of reasoning shown in lines mode.
thinking_lines = 2
show_timestamps = false
mermaid_enabled = true
# Maximum visible Unicode graphemes per second in assistant messages.
message_chars_per_second = 600
# Maximum wrapped Preview display rows per second.
preview_lines_per_second = 60
user_input_padding = 1
# Committed message-pane share in wide two-pane mode (25.00..=100.00%).
message_pane_percent = 64.0
# 0 = unlimited (terminal width minus side margins).
page_max_width = 0
# Horizontal alignment of the capped content page: center | left | right.
page_align = "center"
