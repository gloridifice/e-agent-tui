[package]
name = "e-pi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pi RPC adapter and pie executable for the e agent TUI"
readme = "README.md"
keywords = ["terminal", "tui", "agent", "pi"]
categories = ["command-line-interface", "development-tools"]
include = ["src/**", "README.md", "LICENSE.md"]

[lib]
name = "e_pi"
path = "src/lib.rs"

[[bin]]
name = "pie"
path = "src/main.rs"

[dependencies]
e-tui.workspace = true
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
arboard = "3"
png = "0.18"
tempfile = "3"
toml = "1.1"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.11"
winapi = { version = "0.3", features = ["winbase", "wincon", "winuser", "processenv", "consoleapi", "handleapi"] }

[dev-dependencies]
