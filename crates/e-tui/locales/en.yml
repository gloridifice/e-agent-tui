help.body: |
  # e help

  ## Input and control

  - `Enter`: send as soon as possible without interrupting the active turn
  - `Ctrl+Enter`: wait until the active turn has fully ended
  - `Shift+Enter`: insert a newline
  - `Ctrl+V`: paste an image or text
  - `Ctrl+Backspace` / `Ctrl+W`: delete the previous word
  - `↑` / `↓`: move between lines and switch history prompts at the boundaries
  - `Esc`: cancel the newest queued message, or interrupt when the queue is empty
  - `Ctrl+C`: clear input; quit when idle with an empty input

  ## Views and navigation

  - `Ctrl+Y`: enter Reading View
  - `Ctrl+P`: toggle full-screen Preview
  - `Ctrl+N`: open the resume-session Input Page
  - `Ctrl+H`: open the shortcut help overlay
  - `PageUp` / `PageDown` / mouse wheel: scroll messages
  - Type `/`: complete built-in and runtime commands; use `Tab` or `↑` / `↓` to choose

  ## Input Pages and interaction

  - Input Pages: move with arrow keys or `hjkl`, `Enter` acts, `Esc` goes back; `hjkl` types while editing
  - Approval: `Y` allows, `n` rejects
  - Questions: `h` / `l` switches questions, `j` / `k` switches options, `Space` selects, `Enter` submits
  - Reading View: `j` / `k` navigates blocks, `l` enters an item, spatial `h` / `j` / `k` / `l` navigates items, `y` copies the complete block
overlay.help.title: "Help — e"
overlay.help.row1: "Enter Send ASAP   Ctrl+Enter Send after turn   Shift+Enter Newline   Ctrl+V Paste image/text   Ctrl+Backspace/Ctrl+W Delete word"
overlay.help.row2: "Esc Cancel newest queued message/interrupt when queue empty   Ctrl+C Clear input/quit when idle   /exit /q /quit Quit"
overlay.help.row3: "Ctrl+Y Reading View   Ctrl+P Preview   Ctrl+N Resume-session Input Page   Ctrl+H Help"
overlay.help.row4: "Type /: complete built-in and current-session DSH/plugin commands   Tab/↑↓ Select"
overlay.help.row5: "/settings Settings   /login Login (API key/Proxy)   /new [mode] New conversation   PgUp/PgDn/mouse Scroll messages"
overlay.help.row6: "Mouse: drag the Bark separator to resize messages; left-drag visible Transcript/Preview text to copy; Reading View y copies the complete source"
overlay.help.row7: "/theme Switch theme   /model [provider/model] Select model   /effort Select reasoning effort   /reload Reload config/themes/skills   /skill:<name> Inject skill"
overlay.help.row8: "Input Page: arrows/hjkl move focus (Settings ←→/hl switch pages)   Enter Act   Esc Back; hjkl types while editing"
overlay.help.row9: "/resume Open resume-session Input Page (type to filter, ↑↓ select) / /resume <session ID> Switch directly"
overlay.help.row10: "Approval: Y Allow / n Deny   Questions: h/l/←→ Switch question  j/k/↑↓ Switch option  Space Select/toggle  Enter Next/submit"
overlay.help.row11: "Reading View: j/k Navigate blocks  l Enter item  h/j/k/l Navigate items  y Copy complete block  Esc Back/exit"
overlay.help.row12: "q/Esc Close help"
