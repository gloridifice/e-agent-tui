name = "deepseek-e"

[colors]
midnight = "#141828"
night = "#141828"
panel = "#1e2438"
selection = "#2a3352"
muted = "#5c6480"
text = "#d8dceb"
success = "#7ad88f"
link = "#7aa2ff"
accent = "#4d6bfe"
emphasis = "#c792ea"
danger = "#ff6b7a"
warning = "#ffcc66"
coral = "#ffa07a"
bark = "#5c6480"
umber = "#2a3352"
added_bg = "#182b20"
removed_bg = "#2f1c22"
added_accent = "#7ad88f"
removed_accent = "#ff6b7a"

[semantics.surface]
base = { fg = "text", bg = "midnight" }
panel = { fg = "text", bg = "panel" }
selection = { fg = "text", bg = "selection" }
primary_text = { fg = "text" }
muted_text = { fg = "muted" }

[semantics.markdown]
text = { fg = "text" }
heading1 = { fg = "midnight", bg = "accent", bold = true }
heading2 = { fg = "success", bold = true }
heading3 = { fg = "link" }
heading4 = { fg = "emphasis", italic = true }
heading5 = { fg = "link" }
heading6 = { fg = "muted" }
emphasis = { fg = "emphasis", italic = true }
strong = { fg = "emphasis", bold = true }
strikethrough = { fg = "text" }
inline_code = { fg = "emphasis", bg = "midnight", padding = 1 }
link_text = { fg = "emphasis", bold = true }
link_url = { fg = "link", underline = true }
image = { fg = "link", italic = true }
quote_marker = { fg = "muted" }
rule = { fg = "muted" }
code_block_bg = { fg = "text", bg = "midnight" }
table_border = { fg = "muted" }
table_header = { fg = "text", bold = true }
list_marker = { fg = "muted" }
task_checked = { fg = "success" }
task_unchecked = { fg = "muted" }
mermaid_border = { fg = "muted" }
mermaid_node = { fg = "text" }
mermaid_edge = { fg = "muted" }
mermaid_edge_label = { fg = "link" }
mermaid_title = { fg = "accent", bold = true }

[semantics.markdown_weak]
text = { fg = "bark" }
heading1 = { fg = "bark", bold = true }
heading2 = { fg = "bark", bold = true }
heading3 = { fg = "bark" }
heading4 = { fg = "bark", italic = true }
heading5 = { fg = "bark" }
heading6 = { fg = "umber" }
emphasis = { fg = "bark", italic = true }
strong = { fg = "bark", bold = true }
strikethrough = { fg = "umber" }
inline_code = { fg = "bark", bg = "night", padding = 1 }
link_text = { fg = "bark", bold = true }
link_url = { fg = "bark", underline = true }
image = { fg = "bark", italic = true }
quote_marker = { fg = "umber" }
rule = { fg = "umber" }
code_block_bg = { fg = "bark", bg = "night" }
table_border = { fg = "umber" }
table_header = { fg = "bark", bold = true }
list_marker = { fg = "umber" }
task_checked = { fg = "bark" }
task_unchecked = { fg = "umber" }
mermaid_border = { fg = "umber" }
mermaid_node = { fg = "bark" }
mermaid_edge = { fg = "umber" }
mermaid_edge_label = { fg = "bark" }
mermaid_title = { fg = "bark", bold = true }

[semantics.code]
text = { fg = "text" }
comment = { fg = "muted" }
keyword = { fg = "midnight", bold = true }
type = { fg = "success", bold = true }
function = { fg = "emphasis", bold = true }
string = { fg = "emphasis", italic = true }
constant = { fg = "emphasis" }
attribute = { fg = "emphasis", italic = true }
escape = { fg = "link", underline = true }
invalid = { fg = "text" }
meta = { fg = "muted" }

[semantics.code_weak]
text = { fg = "bark" }
comment = { fg = "umber" }
keyword = { fg = "bark", bold = true }
type = { fg = "bark", bold = true }
function = { fg = "bark", bold = true }
string = { fg = "bark", italic = true }
constant = { fg = "bark" }
attribute = { fg = "bark", italic = true }
escape = { fg = "bark", underline = true }
invalid = { fg = "umber" }
meta = { fg = "umber" }

[semantics.input]
background = { fg = "text", bg = "panel" }
text = { fg = "text" }
prompt = { fg = "accent" }
cursor = { fg = "midnight", bg = "text" }
hint = { fg = "muted" }
placeholder = { fg = "emphasis", bold = true }
selection = { fg = "midnight", bg = "text" }
status = { fg = "text" }
status_hint = { fg = "muted" }
status_accent = { fg = "accent" }

[semantics.working_status]
idle = { fg = "muted" }
waiting = { fg = "muted" }
running = { fg = "warning" }
success = { fg = "success" }
failure = { fg = "danger" }
cancelled = { fg = "warning" }

[semantics.log]
info = { fg = "muted" }
warning = { fg = "warning" }
error = { fg = "danger" }

[semantics.activity]
label = { fg = "selection" }
detail = { fg = "muted" }
metadata = { fg = "muted" }

[semantics.card]
user = { fg = "text", bg = "panel" }
context = { fg = "muted", bg = "panel" }
detail = { fg = "muted", bg = "panel" }
attachment = { fg = "muted", bg = "panel" }

[semantics.overlay]
background = { fg = "text", bg = "panel" }
border = { fg = "accent" }
text = { fg = "text" }
muted = { fg = "muted" }
selection = { fg = "midnight", bg = "text" }
accent = { fg = "accent" }
selected_marker = { fg = "success" }
unselected_marker = { fg = "text" }

[semantics.diff]
text = { fg = "text" }
added = { fg = "text", bg = "added_bg" }
removed = { fg = "text", bg = "removed_bg" }
added_accent = { fg = "added_accent" }
removed_accent = { fg = "removed_accent" }
context_accent = { fg = "bark" }
separator = { fg = "umber" }

[semantics.separator]
bar = { fg = "muted", bg = "midnight" }
line = { fg = "muted", bg = "midnight" }
placeholder = { fg = "midnight", bg = "muted" }
