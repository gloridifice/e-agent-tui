[package]
name = "e-dsh"
version = "0.0.3"
edition = "2021"
description = "DSH adapter and dshe executable for the e agent TUI"

[lib]
# Keep the existing import path during the behavior-preserving extraction.
name = "e"
path = "src/lib.rs"

[[bin]]
name = "dshe"
path = "src/main.rs"

[features]
default = []
# Tracy profiler instrumentation (real-time profiler; see ../docs/tracy.md).
# Build the profiling binary with: cargo build --offline --release --features tracy
tracy = ["dep:tracy-client", "e-tui/tracy"]

[dependencies]
e-tui = { path = "../e-tui" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
pulldown-cmark = "0.13"
arboard = "3"
wasmi = "1.1"
toml = "1.1"
directories = "6"
# Windows console input mode + native modifier sampling for the raw-input path.
winapi = { version = "0.3", features = ["winbase", "wincon", "winuser", "processenv", "consoleapi", "handleapi"] }
tracy-client = { version = "0.18", optional = true, default-features = false, features = [
    "enable",
    "manual-lifetime",
    "ondemand",
] }

[build-dependencies]
serde_json = "1"
sha2 = "0.11"
