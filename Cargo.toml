# e — Cargo workspace root.
#
# `cargo run` (and cargo build/test/check) from the repo root operates on
# the default member below, so `cargo run` here launches the TUI client.
# bridge/ and tools/ are Node.js and live outside the workspace.
[workspace]
members = ["crates/e-dsh", "crates/e-pi", "crates/e-tui"]
default-members = ["crates/e-dsh"]
# Historical offline vendoring (discontinued; see AGENTS.md) — excluded so
# a local legacy fallback can never join the workspace again.
exclude = ["crates/e-dsh/vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gloridifice/e"
homepage = "https://github.com/gloridifice/e"

[workspace.dependencies]
e-tui = { version = "=0.1.0", path = "crates/e-tui" }

[workspace.metadata.release]
allow-branch = ["master"]
shared-version = true
dependent-version = "upgrade"
consolidate-commits = true
pre-release-hook = ["node", "../../tools/prepare-crate-release.mjs", "{{crate_name}}"]
pre-release-commit-message = "chore(release): v{{version}}"
tag = true
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"
publish = true
push = true
