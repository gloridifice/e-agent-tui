[remote.github]
owner = "gloridifice"
repo = "e"

[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}{{ "\n" }}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
commit_parsers = [
  { message = '^Merge ', skip = true },
  { message = '^chore\(release\)!?:', skip = true },
  { message = '^feat(\([^)]*\))?!?:', group = "<!-- 0 -->Features" },
  { message = '^fix(\([^)]*\))?!?:', group = "<!-- 1 -->Fixes" },
  { message = '^perf(\([^)]*\))?!?:', group = "<!-- 2 -->Performance" },
  { message = '^refactor(\([^)]*\))?!?:', group = "<!-- 3 -->Refactoring" },
  { message = '^docs(\([^)]*\))?!?:', group = "<!-- 4 -->Documentation" },
  { message = '^test(\([^)]*\))?!?:', group = "<!-- 5 -->Tests" },
  { message = '^(build|ci|chore|style)(\([^)]*\))?!?:', group = "<!-- 6 -->Maintenance" },
  { message = ".*", group = "<!-- 7 -->Other" },
]
tag_pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
sort_commits = "newest"
