# Configuration reference: https://embarkstudios.github.io/cargo-deny/checks/index.html

[graph]
# Include optional workspace features (including Tracy) and all target platforms.
all-features = true
targets = []

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "syntect 5.3.0 requires bincode 1.3.3 for syntax dumps. This is a maintenance-only advisory with no patched release; revisit when syntect migrates." },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    # directories -> dirs-sys -> option-ext; do not allow MPL-2.0 globally.
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
]

[bans]
# Transitive dependencies currently require multiple incompatible versions.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
