[package]
name = "e-tui"
version.workspace = true
edition.workspace = true
rust-version = "1.96"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Kernel-neutral terminal frontend for interactive agent sessions"
readme = "README.md"
keywords = ["terminal", "tui", "agent", "ratatui"]
categories = ["command-line-interface", "development-tools"]
include = ["src/**", "assets/**", "locales/**", "README.md", "LICENSE.md"]

[features]
default = []
test-support = []
tracy = ["dep:tracy-client"]

[dependencies]
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
ratex-font = "=0.1.15"
ratex-font-loader = { version = "=0.1.15", features = ["embed-fonts"] }
ratex-layout = "=0.1.15"
ratex-parser = "=0.1.15"
ratex-render = { version = "=0.1.15", features = ["embed-fonts"] }
ratex-types = "=0.1.15"
ratatui-image = { version = "=12.0.0-rc.3", default-features = false }
crossterm = { version = "0.29", features = ["event-stream"] }
dprint-plugin-typescript = "=0.96.1"
futures-util = "0.3"
ratatui = "0.30"
ruff_python_formatter = "=0.0.15"
pulldown-cmark = "0.13"
pulldown-latex = "=0.7.1"
rust-i18n = { version = "4", default-features = false }
rust-latex-parser = "=0.1.0"
# RaTeX's embedded fonts must not fall back to disk in debug builds.
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "regex-fancy",
] }
term-maths = { version = "=1.0.0", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
toml = "1.1"
tracy-client = { version = "0.18", optional = true, default-features = false, features = [
    "enable",
    "manual-lifetime",
    "ondemand",
] }
unicode-linebreak = "0.1.5"
unicode-script = "0.5"
unicode-segmentation = "1.13"
unicode-width = "0.2"
tui-syntax-highlight = { version = "0.2", default-features = false, features = ["regex-fancy"] }
vte = "0.15"
wasmi = "2"

[dev-dependencies]
serde_json = "1"
