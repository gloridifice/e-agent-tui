help.body: |
  # e 帮助

  ## 输入与控制

  - `Enter`：不打断当前工作的情况下尽快发送
  - `Ctrl+Enter`：等待当前工作完全结束后发送
  - `Shift+Enter`：换行
  - `Ctrl+V`：粘贴图片或文本
  - `Ctrl+Backspace` / `Ctrl+W`：删除前一个词
  - `↑` / `↓`：行间移动，并在边界切换历史提示词
  - `Esc`：优先取消最新候选消息；没有候选消息时中断当前工作
  - `Ctrl+C`：清空输入；空闲且输入为空时退出

  ## 视图与导航

  - `Ctrl+Y`：进入阅读视图
  - `Ctrl+P`：切换全屏预览
  - `Ctrl+N`：打开续接会话 Input Page
  - `Ctrl+H`：打开快捷帮助浮层
  - `PageUp` / `PageDown` / 鼠标滚轮：滚动消息
  - 输入 `/`：补全内置命令及当前运行时命令；使用 `Tab` 或 `↑` / `↓` 选择

  ## Input Page 与交互

  - Input Page：方向键或 `hjkl` 移动焦点，`Enter` 执行，`Esc` 返回；编辑状态下 `hjkl` 输入文字
  - 审批：`Y` 允许，`n` 拒绝
  - 提问页：`h` / `l` 切换问题，`j` / `k` 切换选项，`Space` 选择，`Enter` 提交
  - 阅读视图：`j` / `k` 块导航，`l` 进入项目，`h` / `j` / `k` / `l` 项目导航，`y` 复制完整块
overlay.help.title: "帮助 — e"
overlay.help.row1: "Enter 尽快发送   Ctrl+Enter 等待本轮结束后发送   Shift+Enter 换行   Ctrl+V 粘贴图片/文本   Ctrl+Backspace/Ctrl+W 删词"
overlay.help.row2: "Esc 优先取消最新候选消息/队列空时中断   Ctrl+C 清空输入/空闲退出   /exit /q /quit 退出"
overlay.help.row3: "Ctrl+Y 阅读视图   Ctrl+P 预览   Ctrl+N 续接会话 Input Page   Ctrl+H 帮助"
overlay.help.row4: "输入 /：补全内置命令及当前会话自动接入的 DSH/插件命令   Tab/↑↓ 选择"
overlay.help.row5: "/settings 设置面板   /login 登录（API key/Proxy）   /new [模式] 新建会话   PgUp/PgDn/滚轮滚动消息"
overlay.help.row6: "鼠标: 拖动 Bark 分隔条调整消息栏比例；其他左键拖选 Transcript/Preview 可见文本，松开复制；阅读视图 y 复制完整原文"
overlay.help.row7: "/theme 切换主题   /model [provider/model] 选择模型   /effort [强度] 选择推理强度   /reload 重载配置/主题/技能   /skill:<名称> 注入技能"
overlay.help.row8: "Input Page: 方向键/hjkl 移动焦点（Settings ←→/hl 切页）   Enter 执行   Esc 返回；编辑时 hjkl 输入文字"
overlay.help.row9: "/resume 打开续接会话 Input Page（输入筛选、↑↓ 选择）/ /resume <会话ID> 直接切换"
overlay.help.row10: "审批: Y 允许 / n 拒绝   提问页: h/l/←→ 切换问题  j/k/↑↓ 切换选项  Space 选择/多选  Enter 下一题/提交"
overlay.help.row11: "阅读视图: j/k 块导航  l 进入项目  h/j/k/l 项目导航  y 复制完整块  Esc 返回/退出"
overlay.help.row12: "q/Esc 关闭帮助"
