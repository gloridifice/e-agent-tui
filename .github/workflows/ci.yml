name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Generate development changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --offline --no-exec --use-branch-tags
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: development-changelog
          path: CHANGELOG.md
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check Rust workspace
        run: cargo check --workspace --locked
      - name: Test bridge
        run: npm test --prefix bridge
      - name: Verify crate packages
        run: node tools/verify-crate-packages.mjs

  windows:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked
