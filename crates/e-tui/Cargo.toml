[package]
name = "e-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Kernel-neutral terminal frontend for interactive agent sessions"
readme = "README.md"
keywords = ["terminal", "tui", "agent", "ratatui"]
categories = ["command-line-interface", "development-tools"]
include = ["src/**", "assets/**", "locales/**", "README.md", "LICENSE.md"]

[features]
default = []
test-support = []
tracy = ["dep:tracy-client"]

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.30"
pulldown-cmark = "0.13"
rust-i18n = { version = "4", default-features = false }
serde = { version = "1", features = ["derive"] }
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "regex-fancy",
] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
toml = "1.1"
tracy-client = { version = "0.18", optional = true, default-features = false, features = [
    "enable",
    "manual-lifetime",
    "ondemand",
] }
unicode-linebreak = "0.1.5"
unicode-script = "0.5"
unicode-segmentation = "1.13"
unicode-width = "0.2"
tui-syntax-highlight = { version = "0.2", default-features = false, features = ["regex-fancy"] }
vte = "0.15"
wasmi = "2"

[dev-dependencies]
serde_json = "1"
