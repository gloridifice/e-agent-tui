[package]
name = "e-tui"
version = "0.0.3"
edition = "2021"
description = "Kernel-neutral terminal frontend for interactive agent sessions"

[features]
default = []
tracy = ["dep:tracy-client"]

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "regex-fancy",
] }
toml = "1.1"
tracy-client = { version = "0.18", optional = true, default-features = false, features = [
    "enable",
    "manual-lifetime",
    "ondemand",
] }
unicode-linebreak = "0.1.5"
unicode-script = "0.5"
unicode-segmentation = "1.13"
unicode-width = "0.2"
tui-syntax-highlight = { version = "0.2", default-features = false, features = ["regex-fancy"] }
vte = "0.13"
wasmi = "1.1"
