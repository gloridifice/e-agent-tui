schema: lite

context: |
  Repository documentation is the source of project-specific conventions.
  Keep OpenSpec artifacts concise and avoid repeating existing documentation.

rules:
  proposal:
    - Keep the proposal proportional to the change.
    - Do not include implementation details unless they affect the contract.

  specs:
    - Capture only observable behavior and durable contracts.
    - Do not describe implementation details.
    - Check relevant existing specs before modifying behavior.

  tasks:
    - Keep tasks minimal and implementation-oriented.
    - Do not add tasks merely for process completeness.

operations:
  apply:
    guidance:
      - Treat existing living specs as authoritative unless this change explicitly modifies them.
      - Do not silently change behavior that conflicts with existing specs.
      - If implementation reveals that intended behavior must change, update the change artifacts before continuing.

  archive:
    guidance:
      - Keep the completion summary concise.
