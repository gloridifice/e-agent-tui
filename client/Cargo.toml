[package]
name = "e"
version = "0.0.3"
edition = "2021"
description = "e — terminal client for DeepSeek Harness (DSH); the dshe executable"

[[bin]]
name = "dshe"
path = "src/main.rs"

[features]
default = []
# Tracy profiler instrumentation (real-time profiler; see ../docs/tracy.md).
# Build the profiling binary with: cargo build --offline --release --features tracy
tracy = ["dep:tracy-client"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
pulldown-cmark = "0.13"
arboard = "3"
wasmi = "1.1"
toml = "1.1"
directories = "6"
tracy-client = { version = "0.18", optional = true, default-features = false, features = [
    "enable",
    "manual-lifetime",
    "ondemand",
] }

[build-dependencies]
serde_json = "1"
sha2 = "0.11"
