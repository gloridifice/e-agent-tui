help.body: |
  # e help

  Key bindings below reflect the active configuration. `—` means unbound.
  Override actions in `key_mapping.toml` beside `config.toml`; `/reload` applies valid changes atomically.
  `osmain` means Command on macOS and Ctrl on Windows/Linux. Terminal-intercepted shortcuts require terminal configuration or remapping.

  - Input navigation moves between lines, then history at the boundaries. Paste/image blocks remain atomic.
  - Cancel removes all ASAP prompts first, otherwise the newest after-turn prompt; it interrupts only when no candidates remain. Repeated Cancel waits for backend acknowledgment. Clear quits only when idle with empty input.
  - Pi cancels its entire backend queue, including extension steering/follow-up messages; local after-turn prompts are preserved.
  - Page text editors accept ordinary letters; global picker shortcuts do not replace an active page or approval.
  - Reading copies the complete owning block, even with an item selected. Exit leaves Reading; back-to-blocks only leaves Items.
  - Drag any visible screen text to copy on release, including input, status, pages, and popups. Multiline ranges include adjacent panes in screen row order.
  - The display stays fixed while selecting; background work continues and live display resumes on release. Only displayed masks, placeholders, and ellipses are copied; trailing ordinary spaces are omitted.
  - Mouse wheel scrolls messages and cancels selection. A separator press resizes; a text drag starting elsewhere can include its visible glyph.
  - Type `/` to complete built-in and runtime commands.
  - Type `@` to browse project-relative paths. Completion accepts a path without sending; directories continue browsing. Paths containing spaces are quoted.

  ## Active key mappings
