[package]
name = "e-dsh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "DSH adapter and dshe executable for the e agent TUI"
readme = "README.md"
keywords = ["terminal", "tui", "agent", "deepseek"]
categories = ["command-line-interface", "development-tools"]
include = ["src/**", "assets/**", "build.rs", "README.md", "LICENSE.md"]

[lib]
name = "e_dsh"
path = "src/lib.rs"

[[bin]]
name = "dshe"
path = "src/main.rs"

[features]
default = []
# Tracy profiler instrumentation (real-time profiler; see ../docs/tracy.md).
# Build the profiling binary with: cargo build --offline --release --features tracy
tracy = ["e-tui/tracy"]

[dependencies]
e-tui.workspace = true
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
pulldown-cmark = "0.13"
arboard = "3"
png = "0.18"
base64 = "0.22"
wasmi = "2"
toml = "1.1"
directories = "6"
# Windows console input mode + native modifier sampling for the raw-input path.
winapi = { version = "0.3", features = ["winbase", "wincon", "winuser", "processenv", "consoleapi", "handleapi"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
e-tui = { workspace = true, features = ["test-support"] }
